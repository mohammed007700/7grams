<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 GRAMS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a3181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="7 GRAMS">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: white single-column app shell, sticky brand header, fixed bottom tab bar; one light theme by choice */
  color-scheme: light;
  --bg:#ffffff;
  --surface:#faf8f8;
  --line:#ece6e6;
  --ink:#1f1a1a;
  --muted:#7a6f6f;
  --brand:#a3181d;
  --brand-soft:#fbeeee;
  --good:#1c7a4c; --good-soft:#e9f5ee;
  --warn:#a96a0a; --warn-soft:#fdf3e0;
  --bad:#b3261e;  --bad-soft:#fdecea;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.layout{max-width:1240px;margin:0 auto;display:flex;align-items:flex-start}
.shell{flex:1;min-width:0;max-width:980px;margin:0 auto;padding:0 16px 110px}
#side{flex:none;width:236px;position:sticky;top:64px;max-height:calc(100vh - 140px);overflow-y:auto;padding:24px 0 16px;padding-inline-start:16px}
#side.none,#brBtn.none{display:none}
.side-h{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);margin:0 10px 8px}
.sb{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;text-align:start;font-size:13.5px}
.sb:hover{background:var(--surface)}
.sb.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sb .rk{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:11.5px;display:grid;place-items:center;font-weight:600;color:var(--ink)}
.sb .rk.t{background:var(--brand);border-color:var(--brand);color:#fff}
.sb .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.sb .pc{font-size:12px;color:var(--muted);font-weight:500}
#brBtn{display:none}
#sideBack{display:none}
@media (max-width:1023px){
  #brBtn{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #side{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:40;background:#fff;width:272px;max-height:none;padding:18px 12px 90px;border-inline-end:1px solid var(--line);transform:translateX(-105%);transition:transform .2s}
  [dir="rtl"] #side{transform:translateX(105%)}
  #side.open{transform:none}
  #sideBack.on{display:block;position:fixed;inset:0;background:rgba(31,26,26,.4);z-index:39}
}
.rkb{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600}
.rkb.t{background:var(--brand);border-color:var(--brand);color:#fff}
.urow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.urow:last-child{border-bottom:0}
.urow img{width:30px;height:30px;border-radius:50%;flex:none}
.urow .un{flex:1 1 120px;min-width:0;font-weight:500;overflow-wrap:anywhere}
.urow select{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);max-width:100%}
#dotBtn{width:40px;padding:0;font-size:20px;line-height:1}
#dotBtn.none,#undoBtn.none{display:none}
#menu{position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:46;background:#fff;width:min(400px,94vw);overflow-y:auto;padding:16px 16px 90px;border-inline-start:1px solid var(--line);transform:translateX(105%);transition:transform .2s;visibility:hidden}
[dir="rtl"] #menu{transform:translateX(-105%)}
#menu.open{transform:none;visibility:visible}
#menuBack{display:none}
#menuBack.on{display:block;position:fixed;inset:0;background:rgba(31,26,26,.4);z-index:45}
.menu-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.menu-h h2{font-size:18px}
.ucard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.ucard .urow{border:0;padding:0 0 8px}
.ucard select{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}
.ucks{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.ucks label{display:flex;align-items:center;gap:8px;font-size:13.5px}
.ucks input{width:17px;height:17px;accent-color:var(--brand)}
table.ot th,table.ot td{padding:8px 5px}table.ot th{white-space:normal;line-height:1.3}
.sti{width:72px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;background:var(--bg)}
.sti:focus{border-color:var(--brand);outline:none}
td.od b{font-family:var(--display)}
td.od.z{color:var(--muted)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;text-align:start}
.trow:last-child{border-bottom:0}.trow:hover{background:var(--surface)}
.trow .tt{display:flex;flex-direction:column;min-width:0}
.tfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.tgh{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:13.5px;background:var(--surface);border-radius:8px;padding:6px 10px;margin-top:6px}
.tf{display:flex;flex-direction:column;gap:4px;min-width:0}
.tf label{font-size:13px}
.tf input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);width:100%}
.tf.bad input{border-color:var(--bad);background:var(--bad-soft)}
.tmsg{font-size:12.5px;color:var(--bad);display:flex;flex-direction:column;gap:2px}
.tmsg span{color:var(--ink)}
.citem{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.citem .tmsg,.citem .cnote{grid-column:1/-1}
.citem.bad .ct{color:var(--bad)}
.cnote{border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:100%;background:var(--bg)}
.seg.yn button.on.y{background:var(--good)}.seg.yn button.on.n{background:var(--bad)}
.pcap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.pcap.gr{grid-column:1/-1;margin:0}
.pcap .need{font-size:12.5px;color:var(--bad);font-weight:600}
.pth{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.cm .hd b{font-weight:600}
.cm .st{color:#e0a100;letter-spacing:1px;direction:ltr}
.cm p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.field textarea{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);width:100%;min-height:70px;font:inherit;color:inherit;resize:vertical}
.hits{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand img{width:38px;height:38px;object-fit:contain}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.5px;direction:ltr}
.role{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.role.emp{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.month{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.month button:hover{background:var(--surface);color:var(--ink)}
.month span{min-width:104px;text-align:center;font-weight:600;font-size:14px}
.lang{border:1px solid var(--line);background:var(--bg);border-radius:99px;height:40px;padding:0 14px;font-weight:600;font-size:13.5px}
.lang:hover{background:var(--surface)}

h1{font-family:var(--display);font-size:22px;font-weight:700;margin:22px 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media (max-width:420px){.g3{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:16px;min-width:0}
.card.soft{background:var(--surface)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:22px;margin-top:2px;overflow-wrap:anywhere}
.kpi .v small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-inline-start:4px}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:148px;height:148px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--display);font-size:28px;font-weight:700}
.ring .c span{font-size:12px;color:var(--muted)}
.hero-f{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:860px){.hero-f{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.hero-f{grid-template-columns:1fr 1fr;text-align:start}}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface);color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#d5caca;background:var(--surface)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#8a1418}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 150px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none}

.chart{position:relative;height:260px}
.chart.tall{height:340px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px}
td.n,th.n{text-align:end}
tr:last-child td{border-bottom:0}
.bar{height:6px;background:var(--surface);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}

.pb{position:relative;display:inline-block;min-width:84px;text-align:center;padding:1px 8px;border-radius:6px;background:var(--surface);overflow:hidden}
.pb i{position:absolute;inset-block:0;inset-inline-start:0;background:#e3dcdc}
.pb .num{position:relative}
.pb.good i{background:#bfe3cd}.pb.warn i{background:#f6dca6}.pb.bad i{background:#f6c9c4}.pb.ach i{background:#ecc3c5}
table.bt{font-size:13px}table.bt th,table.bt td{padding:8px 6px}table.bt th{white-space:normal;line-height:1.35;vertical-align:bottom}.bt .pb{min-width:70px}.bt .pill{white-space:nowrap}
table.bt tr.tot td{font-weight:600;background:var(--surface)}
table.bt td:nth-child(2),table.bt th:nth-child(2){position:sticky;inset-inline-start:0;background:var(--bg);z-index:1}
table.bt tr.tot td:nth-child(2){background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:15px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.stars{color:#e0a100;letter-spacing:2px;font-size:20px;direction:ltr}
.insight{border-inline-start:3px solid var(--brand);padding:6px 12px;background:var(--brand-soft);border-radius:8px;font-size:14px}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:#d9d0d0;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{inset-inline-start:21px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 16px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--brand);color:#fff}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line)}
nav.tabs div{max-width:800px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs div::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 58px;border:0;background:none;padding:8px 0 10px;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500;position:relative}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs button.on::before{content:"";position:absolute;top:-1px;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(31,26,26,.45);display:none;align-items:flex-end;justify-content:center;padding:16px}
.modal.on{display:flex}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:88%;overflow:auto;padding:20px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;max-width:90%;display:none}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function toNum(v){
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (v == null) return null;
  let s = normDigits(v).trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s);

function parseDate(v){
  let y,m,d;
  if (v instanceof Date && !isNaN(v)) { y=v.getFullYear(); m=v.getMonth()+1; d=v.getDate(); }
  else if (typeof v === "number") {
    if (v < 20000 || v > 80000 || typeof XLSX === "undefined") return null;
    const p = XLSX.SSF.parse_date_code(v); if (!p) return null; y=p.y; m=p.m; d=p.d;
  } else if (typeof v === "string") {
    const s = normDigits(v).trim(); let r;
    if ((r = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) { y=+r[1]; m=+r[2]; d=+r[3]; }
    else if ((r = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) {
      const a=+r[1], b=+r[2]; y=+r[3]; if (y<100) y+=2000;
      if (b>12 && a<=12) { m=a; d=b; } else { d=a; m=b; }
    } else { const t = Date.parse(s); if (isNaN(t)) return null; const D=new Date(t); y=D.getFullYear(); m=D.getMonth()+1; d=D.getDate(); }
  } else return null;
  if (!(y>2000 && y<2100 && m>=1 && m<=12 && d>=1 && d<=31)) return null;
  return {y,m,d};
}

function recUndo(coll,id){ const prev = coll==="settings" ? clone(S.settings) : (S[coll][id]!==undefined ? clone(S[coll][id]) : null); UNDO.push({b:BATCH,coll,id,prev}); if(UNDO.length>300) UNDO.shift(); }
async function undoLast(){
  if(!UNDO.length) return; const b=UNDO[UNDO.length-1].b; let ok=true;
  while(UNDO.length&&UNDO[UNDO.length-1].b===b){ const u=UNDO.pop();
    if(u.coll==="settings") S.settings=u.prev; else if(u.prev==null) delete S[u.coll][u.id]; else S[u.coll][u.id]=u.prev;
    if(S.db){ try{ const ref=S.db.doc(u.coll+"/"+u.id); if(u.prev==null) await ref.delete(); else await ref.set(u.prev); if(u.coll==="sales"&&u.prev) mirrorSales(u.id,u.prev); }catch(e){ ok=false; } } }
  S.stockDirty={}; S.opDraft=null; render(true); toast(T(ok?"تم التراجع عن آخر تغيير.":"تعذّر التراجع عن جزء من التغيير."));
}
async function save(coll, id, data){
  recUndo(coll,id);

  if (!S.db) { render(true); return true; }
  try { await S.db.doc(coll+"/"+id).set(data); if(coll==="sales") mirrorSales(id,data); return true; }

}

/* ---------- calculations ---------- */
function salesStats(mk,branch){
  const full = S.sales[mk] || {};
  const doc = branch ? {days:(full.bd||{})[branch]||{}, total:+(full.branches||{})[branch]||0, target:+(full.bt||{})[branch]||0, orders:+(full.bo||{})[branch]||0, od:(full.bod||{})[branch]||{}, file:full.file} : full;
  const days = doc.days || {};
  const keys = Object.keys(days).sort(); const D = dim(mk);
  const sum = keys.reduce((a,k)=>a+(+days[k]||0),0);
  const total = keys.length ? sum : (+doc.total||0);
  const bt = doc.bt || {};
  const btSum = Object.keys(bt).reduce((a,k)=>a+(+bt[k]||0),0);
  const target = btSum || +doc.target||0;
  const gk = Object.keys(full.days||{}).sort();
  const elapsed = gk.length ? +gk[gk.length-1] : 0;
  const curMk = mkOf(now.getFullYear(), now.getMonth()+1);
  const cal = mk<curMk ? D : mk===curMk ? now.getDate()-1 : 0;
  const left = Math.max(D-cal,0);
  const remaining = Math.max(target-total,0);
  const p = target ? total/target : null;
  const expected = cal/D;
  let st = {c:"mute",t:"لا يوجد تارقت"};
  if (target) {
    if (p>=1) st={c:"good",t:"تحقق التارقت"};
    else if (!elapsed) st={c:"mute",t:"بانتظار بيانات المبيعات"};
    else if (p>=expected) st={c:"good",t:"على المسار"};
    else if (p>=expected*0.9) st={c:"warn",t:"قريب من المسار"};
    else st={c:"bad",t:"متأخر عن المسار"};
  }
  const orders = +doc.orders||0;
  return {doc,days,keys,D,total,target,btSum,elapsed,cal,exp:target*cal/D,left,remaining,p,st,orders,aov:orders?total/orders:null,
    need: target && left>0 ? remaining/left : null,
    avg: elapsed ? total/elapsed : null,
    forecast: elapsed ? total/elapsed*D : null, has: keys.length>0 || total>0};
}
function branchStatus(ach,pace){
  if (ach==null) return {c:"mute",t:"لا يوجد تارقت"};
  if (ach>=1) return {c:"good",t:"تحقق التارقت"};
  if (pace==null) return {c:"mute",t:"بانتظار بيانات المبيعات"};
  if (pace>=1) return {c:"good",t:"على المسار"};
  if (pace>=0.9) return {c:"warn",t:"قريب من المسار"};
  return {c:"bad",t:"متأخر عن المسار"};
}
function branchNames(st){ return [...new Set([...Object.keys(st.doc.branches||{}),...Object.keys(st.doc.bt||{})])]; }
function branchRows(st){
  const bt=st.doc.bt||{}, br=st.doc.branches||{}, bo=st.doc.bo||{}, frac=st.cal/st.D;
  const mk=(n,t,s,o)=>{ const exp=t*frac, rem=Math.max(t-s,0), ach=t?s/t:null, pace=exp>0?s/exp:null;
    return {n,t,s,o,aov:o?s/o:null,exp,vr:s-exp,ach,pace,rem,need:t&&st.left>0?rem/st.left:null,st:branchStatus(ach,pace)}; };
  const rows=branchNames(st).map(n=>mk(n,+bt[n]||0,+br[n]||0,+bo[n]||0)).sort((a,b)=>(b.ach==null?-1:b.ach)-(a.ach==null?-1:a.ach)||b.s-a.s);
  rows.forEach((r,i)=>r.rank=i+1);
  const tot=mk("",rows.reduce((a,r)=>a+r.t,0),rows.reduce((a,r)=>a+r.s,0),rows.reduce((a,r)=>a+r.o,0));
  return {rows,tot};
}
const bid = n => { let h=2166136261; for (const c of String(n)) { h^=c.codePointAt(0); h=Math.imul(h,16777619); } return (h>>>0).toString(36); };
const wasteBranchDocs = mk => Object.keys(S.wasteb).map(k=>S.wasteb[k]).filter(d=>d&&d.mk===mk&&d.branch).sort((a,b)=>String(a.branch).localeCompare(String(b.branch)));

function wasteStats(mk,branch){
  const doc = branch ? wasteBranchDocs(mk).find(d=>d.branch===branch) : S.waste[mk]; if (!doc) return null;
  const items = doc.items || [];
  const byVal = (doc.wasteVal||0) > 0;
  const metric = it => byVal ? (it.v||0) : (it.w||0);
  const sorted = items.slice().sort((a,b)=>metric(b)-metric(a));
  const totalMetric = byVal ? doc.wasteVal : doc.wasteQty;
  const top3 = sorted.slice(0,3).reduce((a,i)=>a+metric(i),0);
  return {doc, sorted, byVal, metric, totalMetric,
    rate: doc.recQty>0 ? doc.wasteQty/doc.recQty : null,
    top3share: totalMetric>0 ? top3/totalMetric : null};
}
function reviewGroups(){
  const g={};
  Object.keys(S.reviews).forEach(id=>{ const d=S.reviews[id]; if(!d||d.rating==null) return; const b=d.branch||""; (g[b]||(g[b]=[])).push(Object.assign({id},d)); });
  Object.keys(g).forEach(b=>g[b].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0));
  return g;
}
function reviewSummary(){
  const g=reviewGroups();
  const rows=Object.keys(g).sort().map(b=>{ const l=g[b]; return {b,l,r:l[l.length-1],p:l[l.length-2]}; });
  const cnt=rows.reduce((a,x)=>a+(+x.r.count||0),0);
  const avg=!rows.length?null:cnt>0?rows.reduce((a,x)=>a+x.r.rating*(+x.r.count||0),0)/cnt:rows.reduce((a,x)=>a+x.r.rating,0)/rows.length;
  return {g,rows,cnt,avg,last:rows.reduce((a,x)=>x.r.date>a?x.r.date:a,"")};
}
function allBranches(){
  const s=new Set();
  Object.values(S.sales).forEach(d=>{ if(!d) return; Object.keys(d.branches||{}).forEach(n=>s.add(n)); Object.keys(d.bt||{}).forEach(n=>s.add(n)); });
  Object.values(S.wasteb).forEach(d=>d&&d.branch&&s.add(d.branch));
  Object.values(S.reviews).forEach(d=>d&&d.branch&&s.add(d.branch));
  Object.values(S.orders).forEach(d=>d&&d.branch&&s.add(d.branch));
  Object.values(S.staff).forEach(d=>d&&d.branch&&s.add(d.branch));
  return [...s].sort();
}

function menuStats(mk){
  const doc=S.menu[mk]; if(!doc) return null;
  const hasQ=(doc.totalQty||0)>0, hasV=(doc.totalVal||0)>0;
  const by = (S.menuBy==="q"&&hasQ)||(S.menuBy==="v"&&hasV) ? S.menuBy : (hasQ?"q":"v");
  const sorted=(doc.items||[]).slice().sort((a,b)=>(b[by]||0)-(a[by]||0));
  const n=sorted.length, total=by==="q"?doc.totalQty:doc.totalVal;
  return {doc,hasQ,hasV,by,sorted,total,top:sorted.slice(0,5),bottom:sorted.slice(Math.max(5,n-5)).reverse()};
}

async function importPrices(m,rows,file){
  const hasP=m.price>=0, hasAQ=m.amount>=0&&m.qty>=0;
  if(!hasP&&!hasAQ){ toast(T("اربط إجمالي المبيعات والكمية معاً، أو عمود سعر الحبة.")); throw shownErr(); }
  const map=new Map(), old={}; priceList().forEach(x=>old[canonKey(x.n)]=x.w);
  for(const r of rows){ if(!r) continue; const name=r[m.item]==null?"":String(r[m.item]).trim(); if(!name||TOTAL_ROW.test(name)) continue;
    const k=canonKey(name), o=map.get(k)||{n:name.slice(0,80),amt:0,q:0,pr:0}; map.set(k,o);
    if(hasAQ){ const a=toNum(r[m.amount]), q=toNum(r[m.qty]); if(a>0&&q>0){ o.amt+=a; o.q+=q; } }
    if(hasP){ const pr=toNum(r[m.price]); if(pr>0) o.pr=pr; } }
  const items=[...map.entries()].map(([k,o])=>({n:o.n,p:r2(o.q>0?o.amt/o.q:o.pr),q:r2(o.q),w:+old[k]>0?+old[k]:0})).filter(x=>x.p>0).slice(0,300);
  if(!items.length){ toast(T("لم أجد منتجات بأسعار صالحة. راجع ربط الأعمدة.")); throw shownErr(); }
  if(!await save("prices","main",{items,file:String(file).slice(0,80),updatedAt:todayKey})) throw shownErr();
  render(true); toast(T("تم حفظ أسعار {n} منتج.",{n:items.length}));
}

function readFile(file){
  return new Promise((res,rej)=>{
    if (typeof XLSX==="undefined") return rej(new Error("lib"));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("read"));
    fr.onload=()=>{ try{
      const csv=/\.csv$/i.test(file.name);
      const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",raw:csv});
      let best=null;
      wb.SheetNames.forEach(n=>{ const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false}); if(!best||rows.length>best.rows.length) best={name:n,rows}; });
      res(best);
    }catch(e){rej(e)} };
    fr.readAsArrayBuffer(file);
  });
}

async function importSales(m,rows,file){
  const months={}; let n=0, skipped=0; const hasB=m.branch>=0;
  for(const r of rows){ if(!r) continue;
    const amt=toNum(r[m.amount]); if(amt==null) continue;
    if (r.some(c=>typeof c==="string"&&TOTAL_ROW.test(c.trim()))) continue;
    let mk=S.month, day=null;
    if (m.date>=0){ const d=parseDate(r[m.date]); if(!d){skipped++;continue} mk=mkOf(d.y,d.m); day=pad(d.d); }
    const o=months[mk]||(months[mk]={total:0,days:{},branches:{},orders:0,od:{},bo:{},bd:{},bod:{}});
    const oc=m.orders===-2?1:m.orders>=0?Math.max(toNum(r[m.orders])||0,0):0;
    o.total+=amt; o.orders+=oc; if(day){ o.days[day]=(o.days[day]||0)+amt; if(oc) o.od[day]=(o.od[day]||0)+oc; }
    if (hasB){ const b=brName(r[m.branch]);
      o.branches[b]=(o.branches[b]||0)+amt; if(oc) o.bo[b]=(o.bo[b]||0)+oc;
      if(day){ const d=o.bd[b]||(o.bd[b]={}); d[day]=(d[day]||0)+amt; if(oc){ const e=o.bod[b]||(o.bod[b]={}); e[day]=(e[day]||0)+oc; } } }
    n++;
  }
  const mks=Object.keys(months).sort();
  if(!n){ toast(T("لم أجد صفوفاً صالحة. راجع ربط الأعمدة.")); throw shownErr(); }
  for(const mk of mks){ const o=months[mk], ex=S.sales[mk]||{};
    let {branches,bo,bd,bod,days,od,total,orders}=o;
    if (hasB && ex.bd && Object.keys(ex.branches||{}).length){
      branches=Object.assign({},ex.branches); bo=Object.assign({},ex.bo); bd=clone(ex.bd); bod=clone(ex.bod);
      Object.keys(o.branches).forEach(b=>{ branches[b]=o.branches[b]; bd[b]=o.bd[b]||{};
        if(o.bo[b]) bo[b]=o.bo[b]; else delete bo[b];
        if(o.bod[b]) bod[b]=o.bod[b]; else delete bod[b]; });
      days={}; od={};
      Object.values(bd).forEach(x=>Object.keys(x).forEach(k=>days[k]=(days[k]||0)+x[k]));
      Object.values(bod).forEach(x=>Object.keys(x).forEach(k=>od[k]=(od[k]||0)+x[k]));
      total=sumMap(branches); orders=sumMap(bo);
    }
    const ok=await save("sales",mk,{target:+ex.target||0,bt:clone(ex.bt),total:r2(total),days:roundMap(days),branches:roundMap(branches),orders:Math.round(orders),od:roundMap(od),bo:roundMap(bo),bd:roundMap2(bd),bod:roundMap2(bod),file:String(file).slice(0,80),updatedAt:todayKey});
    if(!ok) throw shownErr();
  }
  S.month=mks[mks.length-1]; render(true);
  toast(T(skipped?"تم استيراد {n} صف على {m} شهر، وتجاهل {s} صف بدون تاريخ صحيح.":"تم استيراد {n} صف على {m} شهر.",{n,m:mks.length,s:skipped}));
}
function packWaste(all,cap){
  const tot=all.reduce((a,i)=>({r:a.r+i.r,w:a.w+i.w,v:a.v+i.v}),{r:0,w:0,v:0}), byVal=tot.v>0;
  const items=all.filter(i=>i.w>0||i.v>0).sort((a,b)=>byVal?b.v-a.v:b.w-a.w).slice(0,cap).map(i=>({n:i.n,r:r2(i.r),w:r2(i.w),v:r2(i.v)}));
  return {recQty:r2(tot.r),wasteQty:r2(tot.w),wasteVal:r2(tot.v),count:all.length,items};
}
async function rebuildWaste(mk){
  const docs=wasteBranchDocs(mk);
  if(!docs.length){ await removeQuiet("waste",mk); return true; }
  const map=new Map(); let rq=0,wq=0,wv=0;
  docs.forEach(d=>{ rq+=d.recQty||0; wq+=d.wasteQty||0; wv+=d.wasteVal||0;
    (d.items||[]).forEach(i=>{ const o=map.get(i.n)||{n:i.n,r:0,w:0,v:0}; o.r+=i.r||0; o.w+=i.w||0; o.v+=i.v||0; map.set(i.n,o); }); });
  const pk=packWaste([...map.values()],400);
  return save("waste",mk,Object.assign(pk,{recQty:r2(rq),wasteQty:r2(wq),wasteVal:r2(wv),file:docs[docs.length-1].file||"",updatedAt:todayKey}));
}
async function importWaste(m,rows,file){
  const groups=new Map(), hasB=m.branch>=0, mk=S.month, fn=String(file).slice(0,80);
  for(const r of rows){ if(!r) continue;
    const name=r[m.item]==null?"":String(r[m.item]).trim(); if(!name||TOTAL_ROW.test(name)) continue;
    const w=toNum(r[m.waste]), rc=m.rec>=0?toNum(r[m.rec]):null, v=m.val>=0?toNum(r[m.val]):null;
    if (w==null&&rc==null) continue;
    const bn=hasB?brName(r[m.branch]):"";
    const map=groups.get(bn)||new Map(); groups.set(bn,map);
    const key=name.slice(0,80); const o=map.get(key)||{n:key,r:0,w:0,v:0};
    o.r+=rc||0; o.w+=w||0; o.v+=v||0; map.set(key,o);
  }
  if(!groups.size){ toast(T("لم أجد أصنافاً صالحة. راجع ربط الأعمدة.")); throw shownErr(); }
  let n=0;
  if (!hasB){
    const all=[...groups.get("").values()]; n=all.length;
    for(const d of wasteBranchDocs(mk)) await removeQuiet("wasteb",mk+"_"+bid(d.branch));
    if(!await save("waste",mk,Object.assign(packWaste(all,400),{file:fn,updatedAt:todayKey}))) throw shownErr();
    render(true); toast(T("تم تحليل {n} صنف لشهر {m}.",{n,m:mLabel(mk)}));
  } else {
    for(const [bn,map] of groups){ const all=[...map.values()]; n+=all.length;
      if(!await save("wasteb",mk+"_"+bid(bn),Object.assign({mk,branch:bn,file:fn,updatedAt:todayKey},packWaste(all,300)))) throw shownErr(); }
    if(!await rebuildWaste(mk)) throw shownErr();
    render(true); toast(T("تم تحليل {n} صنف على {b} فرع لشهر {m}.",{n,b:groups.size,m:mLabel(mk)}));
  }
}
async function importMenu(m,rows,file){
  if (m.qty<0 && m.amount<0){ toast(T("اختر عمود الكمية أو عمود المبلغ على الأقل.")); throw shownErr(); }
  const map=new Map();
  for(const r of rows){ if(!r) continue;
    const name=r[m.item]==null?"":String(r[m.item]).trim(); if(!name||TOTAL_ROW.test(name)) continue;
    const q=m.qty>=0?toNum(r[m.qty]):null, v=m.amount>=0?toNum(r[m.amount]):null;
    if (q==null&&v==null) continue;
    const key=name.slice(0,80); const o=map.get(key)||{n:key,q:0,v:0};
    o.q+=q||0; o.v+=v||0; map.set(key,o);
  }
  const all=[...map.values()];
  if(!all.length){ toast(T("لم أجد منتجات صالحة. راجع ربط الأعمدة.")); throw shownErr(); }
  const tq=all.reduce((a,i)=>a+i.q,0), tv=all.reduce((a,i)=>a+i.v,0), by=tq>0?"q":"v";
  all.sort((a,b)=>b[by]-a[by]);
  const keep=all.length>800?all.slice(0,700).concat(all.slice(-100)):all;
  const ok=await save("menu",S.month,{totalQty:r2(tq),totalVal:r2(tv),count:all.length,items:keep.map(i=>({n:i.n,q:r2(i.q),v:r2(i.v)})),file:String(file).slice(0,80),updatedAt:todayKey});
  if(!ok) throw shownErr();
  render(true); toast(T("تم تحليل {n} منتج لشهر {m}.",{n:all.length,m:mLabel(S.month)}));
}

    if(await save("settings","main",s4)){ render(true); toast(T("تم حفظ الإعدادات.")); } }
  else if (act==="upMenu") $("fileMenu").click();

document.addEventListener("change",async e=>{
  const t=e.target;
  if (t.dataset.act==="preview"){ S.preview=t.checked; render(true); return; }
  if (t.dataset.mb && isAdmin()){ const v=t.value; patchMember(t.dataset.mb,m=>{ if(v==="__admin"){ m.role="admin"; m.branch=""; } else { m.role="staff"; m.branch=v; } }); return; }
  if (t.dataset.ms && isAdmin()){ const v=t.value; patchMember(t.dataset.ms,m=>{ m.shift=v==="n"?"n":"m"; }); return; }
  if (t.dataset.mp && isAdmin()){ const k=t.dataset.sec, c=t.checked; patchMember(t.dataset.mp,m=>{ m.perms=Object.assign(ALLP(),m.perms,{[k]:c}); }); return; }
  if (t.dataset.perm && isAdmin()){ const s=clone(S.settings); s.perms=Object.assign({sales:true,menu:true,waste:true,reviews:true},s.perms); s.perms[t.dataset.perm]=t.checked; if(!await save("settings","main",s)) render(true); }
});
$("mPrev").onclick=()=>{ S.month=shiftMonth(S.month,-1); render(true); };
$("mNext").onclick=()=>{ S.month=shiftMonth(S.month,1); render(true); };

/* ---------- boot ---------- */
render(true);
S.dl={save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]), a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); return {status:"saved"}; }};
(function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if (!cfg||!cfg.apiKey||/PASTE|ضع/.test(cfg.apiKey)||typeof firebase==="undefined"){ S.auth="nocfg"; S.ready=true; render(true); return; }
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), fs=firebase.firestore(); S.fbAuth=auth;
  let unsubs=[];
  const DATA=["sales","waste","reviews","menu","wasteb","comments","orders","stock","prices","staff","empsales","tasklog","members"];
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>{ try{ f(); }catch(e){} }); unsubs=[]; DATA.forEach(c=>S[c]={}); S.salesRank={}; S.me=null; S.admin=false; S.db=null; UNDO.length=0;
    if (!u){ S.auth="out"; S.email=""; S.ready=true; render(true); return; }
    const email=String(u.email||"").toLowerCase(); S.email=email; S.auth="loading"; render(true);
    let me=null; try{ const sn=await fs.doc("members/"+email).get(); if(sn.exists) me=sn.data(); }catch(e){}
    const owner=!!email && email===String(window.OWNER_EMAIL||"").trim().toLowerCase();
    if (!me&&!owner){ S.auth="noaccess"; S.ready=true; render(true); return; }
    S.me=me; S.admin=owner||!!(me&&me.role==="admin"); S.db=fs; S.auth="in"; S.ready=true; S.tab="home"; render(true);
    const map=q=>{ const o={}; q.docs.forEach(d=>o[d.id]=clone(d.data())); return o; };
    const sub=(ref,cb)=>unsubs.push(ref.onSnapshot(cb,()=>{}));
    sub(fs.doc("settings/main"),sn=>{ if(sn.exists){ const d=clone(sn.data()); d.perms=Object.assign({sales:true,menu:true,waste:true,reviews:true},d.perms); S.settings=d; } render(); });
    ["prices","menu"].forEach(c=>sub(fs.collection(c),q=>{ S[c]=map(q); render(); }));
    if (S.admin){
      ["sales","waste","reviews","wasteb","orders","stock","staff","members"].forEach(c=>sub(fs.collection(c),q=>{ S[c]=map(q); render(); }));
      sub(fs.collection("comments").orderBy("date","desc").limit(300),q=>{ S.comments=map(q); render(); });
      sub(fs.collection("empsales").orderBy("date","desc").limit(1500),q=>{ S.empsales=map(q); render(); });
      let pruned=false;
      sub(fs.collection("tasklog").orderBy("date","desc").limit(2000),q=>{ S.tasklog=map(q); render();
        if (!pruned && !(q.metadata&&q.metadata.fromCache)){ pruned=true; const cut=new Date(Date.now()-30*864e5).toISOString().slice(0,10), o=S.tasklog;
          const old=Object.keys(o).filter(k=>o[k].date<cut&&o[k].ph&&Object.keys(o[k].ph).length).slice(0,40);
          (async()=>{ for(const k of old){ try{ await fs.doc("taskpics/"+k).delete(); const d=clone(o[k]); d.ph={}; d.pruned=true; await fs.doc("tasklog/"+k).set(d); }catch(e){ break; } } })(); } });
    } else {
      const b=me.branch; if(!b) return;
      ["reviews","wasteb","comments","orders","stock","staff","empsales","tasklog"].forEach(c=>sub(fs.collection(c).where("branch","==",b),q=>{ S[c]=map(q); render(); }));
      sub(fs.collection("salesb").where("branch","==",b),q=>{ const o={}, rk={}; q.docs.forEach(d=>{ const x=d.data(); o[x.month]={branches:{[b]:x.total||0},bt:{[b]:x.target||0},bd:{[b]:x.days||{}},bo:{[b]:x.orders||0},bod:{[b]:x.od||{}},days:x.days||{},file:x.file||""}; rk[x.month]={r:x.rk||0,n:x.rn||0}; }); S.sales=o; S.salesRank=rk; render(); });
    }
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
